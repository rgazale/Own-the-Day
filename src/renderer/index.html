<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>MDC Daily</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Titleblock header strip -->
  <header class="titleblock">
    <div class="tb-left">
      <div class="tb-title">MDC&nbsp;DAILY</div>
      <div class="tb-sub">Design task register</div>
    </div>
    <div class="tb-right">
      <div class="tb-field"><span class="tb-k">DATA AS OF</span><span id="asof" class="tb-v mono">—</span></div>
      <div class="tb-field"><span class="tb-k">SOURCES</span><span id="sources" class="tb-v mono">monday · outlook · mine</span></div>
      <div class="tb-field"><span class="tb-k">DUE / OVERDUE</span><span id="urgent" class="tb-v mono">0</span></div>
    </div>
  </header>

  <div id="errorline" class="errorline" hidden></div>

  <div class="toolbar">
    <button id="syncBtn" class="btn">Sync now</button>
    <button id="addBtn" class="btn btn-ghost">+ Add task</button>
    <span id="syncState" class="mono syncstate"></span>
  </div>

  <!-- Add-task form (hidden until +Add) -->
  <form id="addForm" class="addform" hidden>
    <input id="addTitle" class="inp" type="text" placeholder="Task title" required />
    <div class="addrow">
      <input id="addProject" class="inp" type="text" placeholder="Project (optional)" />
      <input id="addDue" class="inp mono" type="date" />
    </div>
    <div class="addrow">
      <button type="submit" class="btn">Add</button>
      <button type="button" id="addCancel" class="btn btn-ghost">Cancel</button>
    </div>
  </form>

  <main id="list" class="list"></main>

  <footer class="foot mono">
    <span id="footcount">0 tasks</span>
    <span id="footwb"></span>
  </footer>

  <!-- Snooze popover template -->
  <script src="renderer.js"></script>
</body>
</html>
