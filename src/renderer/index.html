<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>MDC Daily</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Titleblock header strip -->
  <header class="titleblock">
    <div class="tb-left">
      <div class="tb-title">MDC&nbsp;DAILY</div>
      <div class="tb-sub">Design task register</div>
    </div>
    <div class="tb-right">
      <div class="tb-field"><span class="tb-k">Updated</span><span id="asof" class="tb-v mono">—</span></div>
      <div class="tb-field"><span class="tb-k">Due / overdue</span><span id="urgent" class="tb-v mono urgent-num">0</span></div>
    </div>
  </header>

  <div id="errorline" class="errorline" hidden></div>

  <div class="toolbar">
    <button id="syncBtn" class="btn btn-primary" title="Refresh from monday and Outlook">↻ Sync now</button>
    <button id="addBtn" class="btn btn-ghost">+ Add task</button>
    <div class="search-wrap">
      <input id="search" class="search" type="text" placeholder="Filter tasks…" autocomplete="off" />
    </div>
    <span id="syncState" class="mono syncstate"></span>
  </div>

  <!-- Add-task form (hidden until +Add) -->
  <form id="addForm" class="addform" hidden>
    <input id="addTitle" class="inp" type="text" placeholder="What needs doing?" required />
    <div class="addrow">
      <input id="addProject" class="inp" type="text" placeholder="Project (optional)" />
      <input id="addDue" class="inp mono" type="date" title="Due date (optional)" />
    </div>
    <div class="addrow addrow-actions">
      <button type="submit" class="btn btn-primary">Add task</button>
      <button type="button" id="addCancel" class="btn btn-ghost">Cancel</button>
    </div>
  </form>

  <main id="list" class="list"></main>

  <footer class="foot">
    <span id="footcount" class="mono">0 open</span>
    <span id="footwb" class="mono"></span>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
